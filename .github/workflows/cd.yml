name: Microservices CD

on:
  push:
    branches: [ master ]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.filter.outputs.user-service }}
      category-service: ${{ steps.filter.outputs.category-service }}
      product-service: ${{ steps.filter.outputs.product-service }}
      inventory-service: ${{ steps.filter.outputs.inventory-service }}
      coupon-service: ${{ steps.filter.outputs.coupon-service }}
      cart-service: ${{ steps.filter.outputs.cart-service }}
      order-service: ${{ steps.filter.outputs.order-service }}
      payment-service: ${{ steps.filter.outputs.payment-service }}
      analytics-service: ${{ steps.filter.outputs.analytics-service }}
      cognito-trigger-service: ${{ steps.filter.outputs.cognito-trigger-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      wishlist-review-service: ${{ steps.filter.outputs.wishlist-review-service }}
      changed-list: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            user-service: 'e-com_backend/user-service/**'
            category-service: 'e-com_backend/category-service/**'
            product-service: 'e-com_backend/product-service/**'
            inventory-service: 'e-com_backend/inventory-service/**'
            coupon-service: 'e-com_backend/coupon-service/**'
            cart-service: 'e-com_backend/cart-service/**'
            order-service: 'e-com_backend/order-service/**'
            payment-service: 'e-com_backend/payment-service/**'
            analytics-service: 'e-com_backend/analytics-service/**'
            cognito-trigger-service: 'e-com_backend/cognito-trigger-service/**'
            notification-service: 'e-com_backend/notification-service/**'
            wishlist-review-service: 'e-com_backend/wishlist-review-service/**'

  deploy-user-service:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.user-service == 'true' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'user-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-category-service:
    needs: [detect-changes, deploy-user-service]
    if: always() && needs.detect-changes.outputs.category-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'category-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-product-service:
    needs: [detect-changes, deploy-category-service]
    if: always() && needs.detect-changes.outputs.product-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'product-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-inventory-service:
    needs: [detect-changes, deploy-product-service]
    if: always() && needs.detect-changes.outputs.inventory-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'inventory-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-coupon-service:
    needs: [detect-changes, deploy-inventory-service]
    if: always() && needs.detect-changes.outputs.coupon-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'coupon-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-cart-service:
    needs: [detect-changes, deploy-coupon-service]
    if: always() && needs.detect-changes.outputs.cart-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'cart-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-order-service:
    needs: [detect-changes, deploy-cart-service]
    if: always() && needs.detect-changes.outputs.order-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'order-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-payment-service:
    needs: [detect-changes, deploy-order-service]
    if: always() && needs.detect-changes.outputs.payment-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'payment-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-analytics-service:
    needs: [detect-changes, deploy-payment-service]
    if: always() && needs.detect-changes.outputs.analytics-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'analytics-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-cognito-trigger-service:
    needs: [detect-changes, deploy-analytics-service]
    if: always() && needs.detect-changes.outputs.cognito-trigger-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'cognito-trigger-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-notification-service:
    needs: [detect-changes, deploy-cognito-trigger-service]
    if: always() && needs.detect-changes.outputs.notification-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'notification-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-wishlist-review-service:
    needs: [detect-changes, deploy-notification-service]
    if: always() && needs.detect-changes.outputs.wishlist-review-service == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      service-name: 'wishlist-review-service'
      stage: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  notify-summary:
    needs: [detect-changes, deploy-user-service, deploy-category-service, deploy-product-service, deploy-inventory-service, deploy-coupon-service, deploy-cart-service, deploy-order-service, deploy-payment-service, deploy-analytics-service, deploy-cognito-trigger-service, deploy-notification-service, deploy-wishlist-review-service]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Run Summary
        run: |
          echo "## :rocket: Microservices CD Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Services Detected:" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ needs.detect-changes.outputs.changed-list }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          USER_RES="${{ needs.deploy-user-service.result }}"
          CAT_RES="${{ needs.deploy-category-service.result }}"
          PROD_RES="${{ needs.deploy-product-service.result }}"
          INV_RES="${{ needs.deploy-inventory-service.result }}"
          COUP_RES="${{ needs.deploy-coupon-service.result }}"
          CART_RES="${{ needs.deploy-cart-service.result }}"
          ORD_RES="${{ needs.deploy-order-service.result }}"
          PAY_RES="${{ needs.deploy-payment-service.result }}"
          ANA_RES="${{ needs.deploy-analytics-service.result }}"
          COG_RES="${{ needs.deploy-cognito-trigger-service.result }}"
          NOT_RES="${{ needs.deploy-notification-service.result }}"
          WISH_RES="${{ needs.deploy-wishlist-review-service.result }}"
          
          echo "### Job Deployment Results:" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | \`${USER_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| category-service | \`${CAT_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| product-service | \`${PROD_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| inventory-service | \`${INV_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| coupon-service | \`${COUP_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| cart-service | \`${CART_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| order-service | \`${ORD_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| payment-service | \`${PAY_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| analytics-service | \`${ANA_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| cognito-trigger-service | \`${COG_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| notification-service | \`${NOT_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| wishlist-review-service | \`${WISH_RES:-skipped}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "### :x: Deployment Status: FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### :white_check_mark: Deployment Status: SUCCESS" >> $GITHUB_STEP_SUMMARY
          fi
