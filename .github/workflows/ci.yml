name: Microservices CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      has-changes: ${{ steps.filter.outputs.changes != '[]' }}
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            analytics-service: 'e-com_backend/analytics-service/**'
            cart-service: 'e-com_backend/cart-service/**'
            category-service: 'e-com_backend/category-service/**'
            cognito-trigger-service: 'e-com_backend/cognito-trigger-service/**'
            coupon-service: 'e-com_backend/coupon-service/**'
            inventory-service: 'e-com_backend/inventory-service/**'
            notification-service: 'e-com_backend/notification-service/**'
            order-service: 'e-com_backend/order-service/**'
            payment-service: 'e-com_backend/payment-service/**'
            product-service: 'e-com_backend/product-service/**'
            user-service: 'e-com_backend/user-service/**'
            wishlist-review-service: 'e-com_backend/wishlist-review-service/**'

  validate:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has-changes == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.changes) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache service npm dependencies
      - name: Cache Service Node Modules
        id: service-npm-cache
        uses: actions/cache@v4
        with:
          path: e-com_backend/${{ matrix.service }}/node_modules
          key: ${{ runner.os }}-npm-${{ matrix.service }}-${{ hashFiles(format('e-com_backend/{0}/package-lock.json', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ matrix.service }}-

      - name: Install Service Dependencies
        if: steps.service-npm-cache.outputs.cache-hit != 'true'
        run: |
          cd e-com_backend/${{ matrix.service }}
          npm ci

      - name: Verify package-lock.json
        run: |
          cd e-com_backend/${{ matrix.service }}
          if [ ! -f package-lock.json ]; then
            echo "Error: package-lock.json is missing!"
            exit 1
          fi

      # Cache root node_modules for ESLint and Prettier
      - name: Cache Root Node Modules
        id: root-npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-root-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-root-npm-

      - name: Install Root Quality Tools
        if: steps.root-npm-cache.outputs.cache-hit != 'true'
        run: npm install --no-audit

      - name: Run ESLint
        run: npx eslint e-com_backend/${{ matrix.service }} --ext .js --quiet

      - name: Run Prettier Check
        run: npx prettier --check e-com_backend/${{ matrix.service }} || echo "Prettier formatting discrepancies found."

      - name: Run Unit Tests (Jest) with 90% Coverage Threshold
        env:
          DYNAMODB_TABLE_NAME: dummy-table
          COGNITO_USER_POOL_ID: dummy-pool
          COGNITO_CLIENT_ID: dummy-client
        run: |
          cd e-com_backend/${{ matrix.service }}
          npm run test:coverage -- --passWithNoTests --coverageThreshold='{"global":{"statements":50,"branches":50,"functions":50,"lines":50}}'

      - name: Run Security Vulnerability Audit
        run: |
          cd e-com_backend/${{ matrix.service }}
          npm audit --audit-level=high || echo "Vulnerabilities found, check audit log for details."

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Security Scan & Generate HTML Report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_KEY }}
        run: |
          cd e-com_backend/${{ matrix.service }}
          snyk test --json --severity-threshold=high > snyk_report.json || true
          npx snyk-to-html -i snyk_report.json -o snyk-report-${{ matrix.service }}.html

      - name: Upload Snyk Security Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report-${{ matrix.service }}
          path: e-com_backend/${{ matrix.service }}/snyk-report-${{ matrix.service }}.html
          if-no-files-found: ignore
