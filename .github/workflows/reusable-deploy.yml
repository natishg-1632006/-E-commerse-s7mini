name: Reusable Deploy

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      stage:
        required: false
        type: string
        default: 'dev'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      AWS_SESSION_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Cache service npm dependencies
      - name: Cache Node Modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: e-com_backend/${{ inputs.service-name }}/node_modules
          key: ${{ runner.os }}-npm-production-${{ inputs.service-name }}-${{ hashFiles(format('e-com_backend/{0}/package-lock.json', inputs.service-name)) }}
          restore-keys: |
            ${{ runner.os }}-npm-production-${{ inputs.service-name }}-

      - name: Install Production Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          cd e-com_backend/${{ inputs.service-name }}
          npm ci --omit=dev

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Service as Zip
        run: |
          cd e-com_backend/${{ inputs.service-name }}
          # Create zip file containing only production files
          zip -q -r deploy.zip src node_modules lambda.js package.json

      - name: Deploy to AWS Lambda
        run: |
          cd e-com_backend/${{ inputs.service-name }}
          
          # 1. Try reading custom mapping from lambda_mapping.json
          FUNCTION_NAME=$(node -e "try { const map = require('../../lambda_mapping.json'); console.log(map['${{ inputs.service-name }}'] || ''); } catch(e) { console.log(''); }")
          
          if [ -n "$FUNCTION_NAME" ]; then
            echo "Mapped service '${{ inputs.service-name }}' to Lambda function: $FUNCTION_NAME (from lambda_mapping.json)"
          else
            echo "No mapping found in lambda_mapping.json. Searching for function containing '${{ inputs.service-name }}'..."
            FUNCTION_NAME=$(aws lambda list-functions --query "Functions[?contains(FunctionName, '${{ inputs.service-name }}')].FunctionName" --output text | awk '{print $1}')
          fi
          
          if [ -z "$FUNCTION_NAME" ]; then
            SLS_SERVICE=$(grep -E "^service:" serverless.yml | awk '{print $2}' | tr -d '\r')
            echo "No function found containing '${{ inputs.service-name }}'. Trying serverless.yml service name: \${SLS_SERVICE}..."
            FUNCTION_NAME=$(aws lambda list-functions --query "Functions[?contains(FunctionName, '\${SLS_SERVICE}')].FunctionName" --output text | awk '{print $1}')
          fi

          if [ -z "$FUNCTION_NAME" ]; then
            echo "=== ERROR: No Lambda function found for service '${{ inputs.service-name }}' ==="
            echo "List of available Lambda functions in your account:"
            aws lambda list-functions --query "Functions[*].FunctionName" --output table
            exit 1
          fi

          echo "Found Lambda function to deploy: $FUNCTION_NAME"
          echo "Deploying zip to Lambda function: $FUNCTION_NAME"
          aws lambda update-function-code --function-name $FUNCTION_NAME --zip-file fileb://deploy.zip
          echo "Deployment successful!"
