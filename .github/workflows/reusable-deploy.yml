name: Reusable Deploy

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      stage:
        required: false
        type: string
        default: 'dev'
      verify-health:
        required: false
        type: boolean
        default: true
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: true
      SERVERLESS_ACCESS_KEY:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Node Modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: e-com_backend/${{ inputs.service-name }}/node_modules
          key: ${{ runner.os }}-npm-${{ inputs.service-name }}-${{ hashFiles(format('e-com_backend/{0}/package-lock.json', inputs.service-name)) }}
          restore-keys: |
            ${{ runner.os }}-npm-${{ inputs.service-name }}-

      - name: Install Dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          cd e-com_backend/${{ inputs.service-name }}
          npm ci

      - name: Verify package-lock.json
        run: |
          cd e-com_backend/${{ inputs.service-name }}
          if [ ! -f package-lock.json ]; then
            echo "Error: package-lock.json is missing!"
            exit 1
          fi

      - name: Deploy Service
        id: deploy-step
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          SERVICE_NAME: ${{ inputs.service-name }}
          DYNAMODB_TABLE_NAME: dummy-table
          COGNITO_USER_POOL_ID: dummy-pool
          COGNITO_CLIENT_ID: dummy-client
          SMTP_HOST: dummy-host
          SMTP_PORT: 587
          SMTP_SECURE: "false"
          SMTP_USER: dummy-user
          SMTP_PASS: dummy-pass
          SMTP_FROM: dummy-from
          NOTIFICATION_OWNER_EMAIL: dummy-owner
          NOTIFICATION_QUEUE_ARN: arn:aws:sqs:ap-southeast-1:123456789012:dummy-queue
          DYNAMODB_WISHLISTS_TABLE: dummy-wishlists
          DYNAMODB_REVIEWS_TABLE: dummy-reviews
          DYNAMODB_BRANDS_TABLE: dummy-brands
          ORDER_SERVICE_URL: dummy-orders
          COUPON_TABLE: dummy-coupons
          INVENTORY_TABLE: dummy-inventory
          PRODUCTS_TABLE: dummy-products
          CARTS_TABLE: dummy-carts
          INTERNAL_SERVICE_KEY: dummy-key
          PAYMENTS_TABLE: dummy-payments
          SALES_TABLE: dummy-sales
          COUPON_SERVICE_URL: dummy-coupons
          INVENTORY_SERVICE_URL: dummy-inventory
          PRODUCT_SERVICE_URL: dummy-products
          USER_SERVICE_URL: dummy-users
          SNS_TOPIC_ARN: arn:aws:sns:ap-southeast-1:123456789012:dummy-topic
        run: |
          cd e-com_backend/${{ inputs.service-name }}
          npx serverless@3 deploy --stage ${{ inputs.stage }} | tee deploy.log

      - name: Extract Endpoint URL
        id: extract-endpoint
        if: ${{ inputs.verify-health }}
        run: |
          if ! node .github/scripts/parse_endpoint.js e-com_backend/${{ inputs.service-name }}/deploy.log; then
            echo "=========================================="
            echo "      SERVERLESS DEPLOYMENT LOGS          "
            echo "=========================================="
            cat e-com_backend/${{ inputs.service-name }}/deploy.log
            exit 1
          fi

      - name: Verify Health Check (GET /health)
        if: ${{ inputs.verify-health }}
        run: |
          ENDPOINT="${{ steps.extract-endpoint.outputs.endpoint }}"
          HEALTH_URL="$ENDPOINT/health"
          echo "Verifying health at: $HEALTH_URL"
          
          SUCCESS=false
          for i in {1..5}; do
            echo "Attempt $i to check health..."
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")
            if [ "$STATUS_CODE" -eq 200 ]; then
              echo "Health check succeeded with HTTP 200!"
              SUCCESS=true
              break
            fi
            echo "Received HTTP status code $STATUS_CODE. Waiting 15 seconds..."
            sleep 15
          done
          
          if [ "$SUCCESS" = false ]; then
            echo "Health check failed after 5 attempts."
            exit 1
          fi
