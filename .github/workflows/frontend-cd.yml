name: Frontend CI/CD

on:
  push:
    branches:
      - master
    paths:
      - 'e-com_frontend/**'
      - '.github/workflows/frontend-cd.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'e-com_frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd e-com_frontend
          npm ci

      - name: Run Linter
        run: |
          cd e-com_frontend
          npm run lint || echo "Linting completed."

      - name: Build Frontend
        env:
          VITE_API_BASE_URL: https://ptmx1zxx9i.execute-api.ap-southeast-1.amazonaws.com
        run: |
          cd e-com_frontend
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-2' }}

      - name: Deploy to S3 Bucket
        run: |
          aws s3 sync e-com_frontend/dist s3://${{ secrets.S3_BUCKET_NAME || 'natish-frontend-193615226126' }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'E35GA2V91WCHH' }} --paths "/*"
