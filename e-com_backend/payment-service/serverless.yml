service: payment-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs22.x
  region: ap-southeast-1
  stage: dev

  profile: Natish

  environment:
    NODE_ENV: production
    SERVICE_NAME: ${env:SERVICE_NAME}
    AWS_REGION: ${env:AWS_REGION}
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME}
    ORDERS_TABLE_NAME: ${env:ORDERS_TABLE_NAME}
    PAYMENT_EVENTS_TOPIC_ARN: ${env:PAYMENT_EVENTS_TOPIC_ARN}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:DYNAMODB_TABLE_NAME}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:DYNAMODB_TABLE_NAME}/index/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:ORDERS_TABLE_NAME}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:ORDERS_TABLE_NAME}/index/*
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - ${env:PAYMENT_EVENTS_TOPIC_ARN}

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY
resources:
  Resources:
    PaymentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: natish_payment
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: paymentid
            AttributeType: S
        KeySchema:
          - AttributeName: paymentid
            KeyType: HASH
    PaymentEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: natish-payment-events
