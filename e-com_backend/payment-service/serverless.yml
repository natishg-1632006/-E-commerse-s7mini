service: payment-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-2'}
  stage: dev

  httpApi:
    cors: true

  environment:
    NODE_ENV: production
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME, 'natish_payment'}
    ORDERS_TABLE_NAME: ${env:ORDERS_TABLE_NAME, 'natish_orders'}
    PAYMENT_EVENTS_TOPIC_ARN: ${env:PAYMENT_EVENTS_TOPIC_ARN, 'arn:aws:sns:ap-south-2:193615226126:natish-payment-events'}
    RAZORPAY_KEY_ID: ${env:RAZORPAY_KEY_ID, ''}
    RAZORPAY_KEY_SECRET: ${env:RAZORPAY_KEY_SECRET, ''}
    RAZORPAY_WEBHOOK_SECRET: ${env:RAZORPAY_WEBHOOK_SECRET, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_TABLE_NAME, 'natish_payment'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_TABLE_NAME, 'natish_payment'}/index/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:ORDERS_TABLE_NAME, 'natish_orders'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:ORDERS_TABLE_NAME, 'natish_orders'}/index/*
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - ${env:PAYMENT_EVENTS_TOPIC_ARN, 'arn:aws:sns:ap-south-2:193615226126:natish-payment-events'}

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY
