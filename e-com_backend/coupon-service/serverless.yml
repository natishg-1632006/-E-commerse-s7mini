service: product-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-2'}
  stage: dev

  environment:
    NODE_ENV: production
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME}

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY
resources:
  Resources:
    CouponsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: natish_coupons
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: couponCode
            AttributeType: S
        KeySchema:
          - AttributeName: couponCode
            KeyType: HASH
