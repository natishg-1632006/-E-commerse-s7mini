service: wishlist-review-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-2'}
  stage: dev

  environment:
    NODE_ENV: production
    DYNAMODB_WISHLISTS_TABLE: ${env:DYNAMODB_WISHLISTS_TABLE, 'natish_wishlists'}
    DYNAMODB_REVIEWS_TABLE: ${env:DYNAMODB_REVIEWS_TABLE, 'natish_reviews'}
    DYNAMODB_BRANDS_TABLE: ${env:DYNAMODB_BRANDS_TABLE, 'natish_brands'}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'ap-south-2_AekUQ0VVq'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, '2osrvmtu0c57dhvgr6ive13but'}
    ORDER_SERVICE_URL: ${env:ORDER_SERVICE_URL, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_WISHLISTS_TABLE, 'natish_wishlists'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_WISHLISTS_TABLE, 'natish_wishlists'}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_REVIEWS_TABLE, 'natish_reviews'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_REVIEWS_TABLE, 'natish_reviews'}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_BRANDS_TABLE, 'natish_brands'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_BRANDS_TABLE, 'natish_brands'}/index/*

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY
