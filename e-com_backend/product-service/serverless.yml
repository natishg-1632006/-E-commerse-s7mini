service: product-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-2'}
  stage: dev

  environment:
    NODE_ENV: production
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME}

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY
resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: natish_products
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
    ProductImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: natish-ecommerce-images
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
              AllowedOrigins: ['*']
              MaxAge: 3000
    ProductEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: natish-product-events
