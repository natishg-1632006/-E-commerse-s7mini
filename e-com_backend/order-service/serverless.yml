service: order-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'ap-south-2'}
  stage: dev

  environment:
    NODE_ENV: production
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME, 'natish_orders'}
    CART_TABLE_NAME: ${env:CART_TABLE_NAME, 'natish_cart'}
    PRODUCTS_TABLE_NAME: ${env:PRODUCTS_TABLE_NAME, 'natish_products'}
    CART_SERVICE_URL: ${env:CART_SERVICE_URL, ''}
    INVENTORY_SERVICE_URL: ${env:INVENTORY_SERVICE_URL, ''}
    ORDER_PAYMENT_TIMEOUT_MINUTES: ${env:ORDER_PAYMENT_TIMEOUT_MINUTES, '15'}
    ORDER_QUEUE_URL: ${env:ORDER_QUEUE_URL, ''}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_TABLE_NAME, 'natish_orders'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:DYNAMODB_TABLE_NAME, 'natish_orders'}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:CART_TABLE_NAME, 'natish_cart'}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${env:PRODUCTS_TABLE_NAME, 'natish_products'}

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY
