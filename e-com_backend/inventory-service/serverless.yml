service: inventory-service

frameworkVersion: "3"

provider:
  tracing:
    lambda: true
    apiGateway: true
  name: aws
  runtime: nodejs22.x
  region: ap-southeast-1
  stage: dev

  profile: Natish

  environment:
    NODE_ENV: production
    SERVICE_NAME: ${env:SERVICE_NAME}
    AWS_REGION: ${env:AWS_REGION}
    DYNAMODB_TABLE_NAME: ${env:DYNAMODB_TABLE_NAME}
    DYNAMODB_MOVEMENTS_TABLE_NAME: ${env:DYNAMODB_MOVEMENTS_TABLE_NAME}
    PRODUCT_SERVICE_URL: ${env:PRODUCT_SERVICE_URL}
    INVENTORY_QUEUE_URL: ${env:INVENTORY_QUEUE_URL}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:DYNAMODB_TABLE_NAME}
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:DYNAMODB_TABLE_NAME}/index/*
            - arn:aws:dynamodb:${env:AWS_REGION}:*:table/${env:DYNAMODB_MOVEMENTS_TABLE_NAME}

functions:
  app:
    handler: lambda.handler
    memorySize: 512
    timeout: 30

    events:
      - httpApi:
          path: /{proxy+}
          method: ANY

      - httpApi:
          path: /
          method: ANY

      - sqs:
          arn: ${env:INVENTORY_QUEUE_ARN}
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
resources:
  Resources:
    InventoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: natish_inventory_v2
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
    InventoryQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: natish-inventory-payment-events-dlq
    InventoryQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: natish-inventory-payment-events
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt InventoryQueueDLQ.Arn
          maxReceiveCount: 3
