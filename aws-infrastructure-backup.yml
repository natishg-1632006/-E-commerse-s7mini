AWSTemplateFormatVersion: '2010-09-09'
Description: 'IaC Backup of manually created resources for Natish E-commerce platform (DynamoDB, SNS, SQS, S3, Cognito, CloudFront, API Gateway)'

Parameters:
  Environment:
    Type: String
    Default: dev
    Description: Environment stage name

Resources:
  # =========================================================================
  # 1. S3 BUCKETS
  # =========================================================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: natish-frontend
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: natish-ecommerce-images
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3000

  # =========================================================================
  # 2. DYNAMODB TABLES
  # =========================================================================
  UserTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_user
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  ProductsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_products
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  CategoriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_categories
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: categoryId
          AttributeType: S
      KeySchema:
        - AttributeName: categoryId
          KeyType: HASH

  CartTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_cart
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH

  CouponsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_coupons
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: couponCode
          AttributeType: S
      KeySchema:
        - AttributeName: couponCode
          KeyType: HASH

  InventoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_inventory_v2
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH

  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_orders
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderid
          AttributeType: S
      KeySchema:
        - AttributeName: orderid
          KeyType: HASH

  PaymentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_payment
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: paymentid
          AttributeType: S
      KeySchema:
        - AttributeName: paymentid
          KeyType: HASH

  WishlistsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_wishlists
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: productId
          KeyType: RANGE

  ReviewsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: natish_reviews
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: reviewId
          AttributeType: S
      KeySchema:
        - AttributeName: reviewId
          KeyType: HASH

  # =========================================================================
  # 3. SNS TOPICS
  # =========================================================================
  ProductEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: natish-product-events

  CategoryEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: natish-category-events

  OrderEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: natish-order-events

  PaymentEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: natish-payment-events

  # =========================================================================
  # 4. SQS QUEUES
  # =========================================================================
  InventoryQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: natish-inventory-payment-events-dlq

  InventoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: natish-inventory-payment-events
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt InventoryQueueDLQ.Arn
        maxReceiveCount: 3

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: natish-notification-events

  OrderPaymentQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: natish-order-payment-events-dlq

  OrderPaymentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: natish-order-payment-events
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderPaymentQueueDLQ.Arn
        maxReceiveCount: 3

  ProductCategoryQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: natish-product-category-events

  # =========================================================================
  # 5. COGNITO USER POOL & CLIENT
  # =========================================================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: natish-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: natish-ecom-client
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # =========================================================================
  # 6. CLOUDFRONT DISTRIBUTION
  # =========================================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: S3-FrontendOrigin
            S3OriginConfig:
              OriginAccessIdentity: ''
        Enabled: true
        DefaultRootObject: index.html
        DefaultCacheBehavior:
          TargetOriginId: S3-FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

  # =========================================================================
  # 7. SHARED API GATEWAY (HTTP API v2)
  # =========================================================================
  SharedHttpApiGateway:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: natish_api_gateway
      ProtocolType: HTTP

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SharedHttpApiGateway
      StageName: dev
      AutoDeploy: true
